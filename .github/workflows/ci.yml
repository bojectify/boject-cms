name: CI

on:
  pull_request:
  # Pushes to main run only the image smoke job, so a new PR's first image
  # build can reuse main's GHA layer cache (#499).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boject
          POSTGRES_PASSWORD: boject
          POSTGRES_DB: boject
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boject"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.45.2
        env:
          MEILI_MASTER_KEY: masterKeyForTestingOnly
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - 7700:7700
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://boject:boject@localhost:5432/boject
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: masterKeyForTestingOnly
      REDIS_URL: redis://localhost:6379
      NUXT_SESSION_PASSWORD: ci-test-session-password-not-a-secret-000
      # Public repos get a 4-vCPU / 16 GB `ubuntu-latest`. resolveMaxTestWorkers()
      # defaults to min(cores-2, 4) = 2 there, so we override to use all 4 cores —
      # the integration suite is I/O-bound (each worker awaits DB + a booted Nuxt
      # server), so oversubscribing cuts wall-clock. Dial to '3' if it flakes on
      # timeouts under contention.
      TEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile

      - name: Build publishable packages (dist consumed by perf typecheck + package tests)
        run: pnpm --filter @boject/cli build && pnpm --filter create-boject-cms build

      - name: Install Playwright browser (Storybook)
        run: pnpm --filter cms exec playwright install --with-deps chromium
        timeout-minutes: 8

      - name: Wait for Meilisearch
        run: |
          attempts=0
          until curl -fsS http://localhost:7700/health >/dev/null 2>&1; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 30 ]; then
              echo "Meilisearch did not become ready" >&2; exit 1
            fi
            sleep 2
          done
          echo "Meilisearch ready"

      - run: pnpm prisma:generate

      - run: pnpm lint

      - run: pnpm format

      - run: pnpm typecheck

      - run: pnpm test

  # Did this change touch anything the CMS image is built from? (#499)
  # Any doubt (no usable base commit, a failed diff) counts as "yes".
  changes:
    runs-on: ubuntu-24.04
    outputs:
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect image inputs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          decide() {
            echo "cms=$1" >> "$GITHUB_OUTPUT"
            echo "image inputs changed: $1 ($2)"
          }
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE...$HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            decide true "no usable base commit for this push"
            exit 0
          else
            range="$BEFORE..$AFTER"
          fi
          if ! files="$(git diff --name-only "$range")"; then
            decide true "git diff $range failed"
            exit 0
          fi
          decide "$(printf '%s\n' "$files" | bash scripts/image-inputs-changed.sh)" "git diff $range"

  # Build the CMS image and run apps/cms/docker/smoke-test.sh against it (#499):
  # the only check that sees a broken image boot or a setting fixed at build
  # time. Mirrors the gate in publish-cms-image.yml (amd64, full test). The
  # scaffolder smoke test (packages/create-boject-cms/scripts/smoke-test.sh)
  # is not run here yet.
  image-smoke:
    needs: changes
    # A skipped required check counts as passing, so run whenever `changes`
    # didn't positively say "no image input changed".
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cms == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          platforms: linux/amd64
          load: true
          tags: boject/cms:gate
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,scope=linux-amd64,mode=max

      - name: Smoke test
        env:
          SMOKE_IMAGE: boject/cms:gate
        run: apps/cms/docker/smoke-test.sh
