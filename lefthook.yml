# Pre-commit only. Tests run in CI: the required `ci` check (.github/workflows/ci.yml)
# runs lint, format, typecheck and the full `pnpm test` on every PR (#516).
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,mjs,ts,vue}'
      run: pnpm lint

    - name: format
      glob: '*.{js,mjs,ts,vue,json,yml,yaml,css,scss,md}'
      exclude: 'pnpm-lock.yaml'
      run: pnpm prettier --check {staged_files}

    - name: typecheck
      glob: '*.{ts,vue}'
      run: pnpm typecheck
